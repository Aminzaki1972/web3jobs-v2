<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Company Dashboard - Web3Jobs</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.dashboard {
    max-width: 900px;
    margin: 60px auto;
    padding: 30px;
}

.dashboard h1 {
    text-align: center;
    margin-bottom: 10px;
}

.dashboard-subtitle {
    text-align: center;
    margin-bottom: 35px;
    opacity: 0.8;
}

.company-form {
    background: rgba(255,255,255,0.04);
    padding: 30px;
    border-radius: 15px;
    border: 1px solid rgba(0,200,255,0.2);
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #111;
    color: white;
    font-size: 16px;
}

.form-group textarea {
    min-height: 140px;
    resize: vertical;
}

.save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
    background: #00bcd4;
    color: white;
}

.save-btn:hover {
    opacity: 0.9;
}

.save-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    text-align: center;
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

.error {
    background: rgba(255,0,0,0.15);
    color: #ff7777;
}

.success {
    background: rgba(0,255,100,0.15);
    color: #66ff99;
}

.loading {
    text-align: center;
    margin: 30px;
}

.user-info {
    text-align: center;
    margin-bottom: 25px;
    opacity: 0.8;
}

</style>

</head>


<body>


<header>

    <div class="logo">

        <a href="index.html">
            Web3Jobs
        </a>

    </div>


    <nav>

        <a href="index.html">
            الرئيسية
        </a>

        <a href="jobs.html">
            الوظائف
        </a>

        <a href="companies.html">
            الشركات
        </a>

        <a href="roadmap.html">
            خارطة الطريق
        </a>

        <a href="company-dashboard.html">
            لوحة الشركة
        </a>

        <a href="my-applications.html">
            طلباتي
        </a>

    </nav>

</header>



<main class="dashboard">

    <h1>
        لوحة الشركة 🏢
    </h1>

    <p class="dashboard-subtitle">
        أنشئ أو حدّث ملف شركتك على Web3Jobs
    </p>


    <div
        id="loading"
        class="loading"
    >
        جاري التحقق من الحساب...
    </div>


    <div
        id="dashboard-content"
        style="display:none;"
    >

        <div
            id="user-info"
            class="user-info"
        ></div>


        <div class="company-form">


            <div class="form-group">

                <label for="companyName">
                    اسم الشركة
                </label>

                <input
                    type="text"
                    id="companyName"
                    placeholder="مثال: Web3Jobs"
                >

            </div>



            <div class="form-group">

                <label for="companyDescription">
                    وصف الشركة
                </label>

                <textarea
                    id="companyDescription"
                    placeholder="اكتب نبذة عن الشركة..."
                ></textarea>

            </div>



            <div class="form-group">

                <label for="companyWebsite">
                    الموقع الإلكتروني
                </label>

                <input
                    type="url"
                    id="companyWebsite"
                    placeholder="https://example.com"
                >

            </div>



            <div class="form-group">

                <label for="companyLocation">
                    الموقع
                </label>

                <input
                    type="text"
                    id="companyLocation"
                    placeholder="Egypt / Remote / Worldwide"
                >

            </div>



            <div class="form-group">

                <label for="companyLogo">
                    رابط شعار الشركة
                </label>

                <input
                    type="url"
                    id="companyLogo"
                    placeholder="https://example.com/logo.png"
                >

            </div>



            <button
                id="saveCompany"
                class="save-btn"
                type="button"
            >
                حفظ بيانات الشركة
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </div>

    </div>

</main>



<footer>

    <p>
        © 2026 Web3Jobs - Web3 Career Platform
    </p>

</footer>



<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
"https://uewocyaspztybnvnkbmo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ap9UMOBhdHdIkW0FCD25nA_NurNviS0";


const web3Supabase =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// ELEMENTS
// ==========================================

const loading =
document.getElementById("loading");

const dashboardContent =
document.getElementById("dashboard-content");

const message =
document.getElementById("message");

const saveButton =
document.getElementById("saveCompany");

const userInfo =
document.getElementById("user-info");


// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

}


// ==========================================
// HIDE MESSAGE
// ==========================================

function hideMessage() {

    message.style.display = "none";

}


// ==========================================
// LOAD COMPANY
// ==========================================

async function loadCompany() {

    try {

        loading.style.display = "block";

        dashboardContent.style.display = "none";

        hideMessage();


        // --------------------------------------
        // GET CURRENT USER
        // --------------------------------------

        const {
            data: sessionData,
            error: sessionError
        } =
        await web3Supabase.auth.getSession();


        if (sessionError) {

            console.error(
                "Session error:",
                sessionError
            );

            throw sessionError;

        }


        const session =
            sessionData.session;


        // --------------------------------------
        // USER NOT LOGGED IN
        // --------------------------------------

        if (!session) {

            loading.textContent =
                "يجب تسجيل الدخول أولاً.";

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

            return;

        }


        const user =
            session.user;


        console.log(
            "Logged in user:",
            user.id
        );


        userInfo.textContent =
            "الحساب: " +
            (user.email || user.id);


        // --------------------------------------
        // GET COMPANY
        // --------------------------------------

        const {
            data: companies,
            error: companyError
        } =
        await web3Supabase
        .from("companies")
        .select("*")
        .eq("user_id", user.id)
        .order("id", {
            ascending: false
        })
        .limit(1);


        if (companyError) {

            console.error(
                "Company fetch error:",
                companyError
            );

            throw companyError;

        }


        // --------------------------------------
        // COMPANY EXISTS
        // --------------------------------------

        if (
            companies &&
            companies.length > 0
        ) {

            const company =
                companies[0];


            document.getElementById(
                "companyName"
            ).value =
                company.name || "";


            document.getElementById(
                "companyDescription"
            ).value =
                company.description || "";


            document.getElementById(
                "companyWebsite"
            ).value =
                company.website || "";


            document.getElementById(
                "companyLocation"
            ).value =
                company.location || "";


            document.getElementById(
                "companyLogo"
            ).value =
                company.logo_url || "";


            // Save company ID

            saveButton.dataset.companyId =
                company.id;

        }


        // --------------------------------------
        // SHOW DASHBOARD
        // --------------------------------------

        loading.style.display = "none";

        dashboardContent.style.display =
            "block";


    }

    catch (error) {

        console.error(
            "Load company error:",
            error
        );


        loading.style.display = "none";

        dashboardContent.style.display =
            "block";


        showMessage(
            "فشل في جلب بيانات الشركة: " +
            (error.message || "خطأ غير معروف"),
            "error"
        );

    }

}



// ==========================================
// SAVE COMPANY
// ==========================================

async function saveCompany() {

    try {

        saveButton.disabled = true;

        saveButton.textContent =
            "جاري الحفظ...";

        hideMessage();


        // --------------------------------------
        // GET USER
        // --------------------------------------

        const {
            data: sessionData,
            error: sessionError
        } =
        await web3Supabase.auth.getSession();


        if (sessionError) {
            throw sessionError;
        }


        const session =
            sessionData.session;


        if (!session) {

            showMessage(
                "يجب تسجيل الدخول أولاً.",
                "error"
            );

            return;

        }


        const user =
            session.user;


        // --------------------------------------
        // GET FORM DATA
        // --------------------------------------

        const name =
            document.getElementById(
                "companyName"
            ).value.trim();


        const description =
            document.getElementById(
                "companyDescription"
            ).value.trim();


        const website =
            document.getElementById(
                "companyWebsite"
            ).value.trim();


        const location =
            document.getElementById(
                "companyLocation"
            ).value.trim();


        const logo_url =
            document.getElementById(
                "companyLogo"
            ).value.trim();


        if (!name) {

            showMessage(
                "من فضلك اكتب اسم الشركة.",
                "error"
            );

            return;

        }


        // --------------------------------------
        // CHECK EXISTING COMPANY
        // --------------------------------------

        const {
            data: existingCompanies,
            error: checkError
        } =
        await web3Supabase
        .from("companies")
        .select("id")
        .eq("user_id", user.id)
        .order("id", {
            ascending: false
        })
        .limit(1);


        if (checkError) {
            throw checkError;
        }


        // --------------------------------------
        // UPDATE EXISTING COMPANY
        // --------------------------------------

        if (
            existingCompanies &&
            existingCompanies.length > 0
        ) {

            const companyId =
                existingCompanies[0].id;


            const {
                error: updateError
            } =
            await web3Supabase
            .from("companies")
            .update({

                name: name,

                description: description,

                website: website,

                location: location,

                logo_url: logo_url

            })
            .eq(
                "id",
                companyId
            )
            .eq(
                "user_id",
                user.id
            );


            if (updateError) {
                throw updateError;
            }


            saveButton.dataset.companyId =
                companyId;


            showMessage(
                "تم تحديث بيانات الشركة بنجاح ✅",
                "success"
            );

        }


        // --------------------------------------
        // CREATE NEW COMPANY
        // --------------------------------------

        else {

            const {
                data: newCompany,
                error: insertError
            } =
            await web3Supabase
            .from("companies")
            .insert({

                user_id: user.id,

                name: name,

                description: description,

                website: website,

                location: location,

                logo_url: logo_url

            })
            .select()
            .limit(1);


            if (insertError) {
                throw insertError;
            }


            if (
                newCompany &&
                newCompany.length > 0
            ) {

                saveButton.dataset.companyId =
                    newCompany[0].id;

            }


            showMessage(
                "تم إنشاء ملف الشركة بنجاح ✅",
                "success"
            );

        }

    }

    catch (error) {

        console.error(
            "Save company error:",
            error
        );


        showMessage(
            "فشل حفظ بيانات الشركة: " +
            (error.message || "خطأ غير معروف"),
            "error"
        );

    }

    finally {

        saveButton.disabled = false;

        saveButton.textContent =
            "حفظ بيانات الشركة";

    }

}



// ==========================================
// BUTTON
// ==========================================

saveButton.addEventListener(
    "click",
    saveCompany
);


// ==========================================
// AUTH STATE
// ==========================================

web3Supabase.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "Auth event:",
            event
        );

    }
);


// ==========================================
// START
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCompany();

    }
);

</script>


</body>

</html>
