<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الشركة - Web3Jobs</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ==========================================
   COMPANY DASHBOARD
========================================== */

.dashboard {

    max-width: 900px;

    margin: 60px auto;

    padding: 30px;

}


.dashboard h1 {

    text-align: center;

    margin-bottom: 10px;

}


.dashboard-subtitle {

    text-align: center;

    margin-bottom: 35px;

    opacity: 0.8;

}


.company-form {

    background: rgba(255,255,255,0.04);

    padding: 30px;

    border-radius: 15px;

    border: 1px solid rgba(0,200,255,0.2);

}


.form-group {

    margin-bottom: 20px;

}


.form-group label {

    display: block;

    margin-bottom: 8px;

    font-weight: bold;

}


.form-group input,
.form-group textarea {

    width: 100%;

    box-sizing: border-box;

    padding: 13px;

    border-radius: 8px;

    border: 1px solid #444;

    background: #111;

    color: white;

    font-size: 16px;

}


.form-group textarea {

    min-height: 140px;

    resize: vertical;

}


.save-btn {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-size: 17px;

    font-weight: bold;

    background: #00bcd4;

    color: white;

}


.save-btn:hover {

    opacity: 0.9;

}


.save-btn:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


.message {

    text-align: center;

    margin-top: 20px;

    padding: 12px;

    border-radius: 8px;

    display: none;

}


.error {

    background: rgba(255,0,0,0.15);

    color: #ff7777;

}


.success {

    background: rgba(0,255,100,0.15);

    color: #66ff99;

}


.loading {

    text-align: center;

    margin: 30px;

    font-size: 18px;

}


.user-info {

    text-align: center;

    margin-bottom: 25px;

    opacity: 0.8;

}


</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <div class="logo">

        <a href="index.html">
            Web3Jobs
        </a>

    </div>


    <nav>

        <a href="index.html">
            الرئيسية
        </a>

        <a href="jobs.html">
            الوظائف
        </a>

        <a href="companies.html">
            الشركات
        </a>

        <a href="roadmap.html">
            خارطة الطريق
        </a>

        <a href="company-dashboard.html">
            لوحة الشركة
        </a>

        <a href="my-applications.html">
            طلباتي
        </a>

    </nav>

</header>



<!-- ==========================================
     COMPANY DASHBOARD
========================================== -->

<main class="dashboard">


    <h1>
        لوحة الشركة 🏢
    </h1>


    <p class="dashboard-subtitle">

        أنشئ أو حدّث ملف شركتك على Web3Jobs

    </p>


    <!-- USER INFO -->

    <div
        id="user-info"
        class="user-info"
    ></div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >

        جاري التحقق من الحساب...

    </div>



    <!-- DASHBOARD CONTENT -->

    <div
        id="dashboard-content"
        style="display:none;"
    >


        <div class="company-form">


            <!-- ==================================
                 COMPANY NAME
            ================================== -->

            <div class="form-group">

                <label for="companyName">

                    اسم الشركة

                </label>


                <input

                    type="text"

                    id="companyName"

                    placeholder="مثال: Web3Jobs"

                    autocomplete="organization"

                >

            </div>



            <!-- ==================================
                 DESCRIPTION
            ================================== -->

            <div class="form-group">

                <label for="companyDescription">

                    وصف الشركة

                </label>


                <textarea

                    id="companyDescription"

                    placeholder="اكتب نبذة عن الشركة..."

                ></textarea>

            </div>



            <!-- ==================================
                 WEBSITE
            ================================== -->

            <div class="form-group">

                <label for="companyWebsite">

                    الموقع الإلكتروني

                </label>


                <input

                    type="url"

                    id="companyWebsite"

                    placeholder="https://example.com"

                    autocomplete="url"

                >

            </div>



            <!-- ==================================
                 LOCATION
            ================================== -->

            <div class="form-group">

                <label for="companyLocation">

                    الموقع

                </label>


                <input

                    type="text"

                    id="companyLocation"

                    placeholder="Egypt / Remote / Worldwide"

                >

            </div>



            <!-- ==================================
                 LOGO
            ================================== -->

            <div class="form-group">

                <label for="companyLogo">

                    رابط شعار الشركة

                </label>


                <input

                    type="url"

                    id="companyLogo"

                    placeholder="https://example.com/logo.png"

                >

            </div>



            <!-- ==================================
                 SAVE BUTTON
            ================================== -->

            <button

                id="saveCompany"

                class="save-btn"

                type="button"

            >

                حفظ بيانات الشركة

            </button>



            <!-- ==================================
                 MESSAGE
            ================================== -->

            <div

                id="message"

                class="message"

            ></div>


        </div>


    </div>


</main>



<!-- ==========================================
     FOOTER
========================================== -->

<footer>

    <p>

        © 2026 Web3Jobs - Web3 Career Platform

    </p>

</footer>



<!-- ==========================================
     SUPABASE + COMPANY SYSTEM
========================================== -->

<script>


// ==========================================
// SUPABASE CONFIGURATION
// ==========================================

const SUPABASE_URL =
    "https://uewocyaspztybnvnkbmo.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_ap9UMOBhdHdIkW0FCD25nA_NurNviS0";


// ==========================================
// CREATE SUPABASE CLIENT
// ==========================================

const { createClient } =
    window.supabase;


const web3Supabase =
    createClient(

        SUPABASE_URL,

        SUPABASE_KEY

    );



// ==========================================
// ELEMENTS
// ==========================================

const loading =
    document.getElementById("loading");


const dashboardContent =
    document.getElementById(
        "dashboard-content"
    );


const userInfo =
    document.getElementById(
        "user-info"
    );


const companyName =
    document.getElementById(
        "companyName"
    );


const companyDescription =
    document.getElementById(
        "companyDescription"
    );


const companyWebsite =
    document.getElementById(
        "companyWebsite"
    );


const companyLocation =
    document.getElementById(
        "companyLocation"
    );


const companyLogo =
    document.getElementById(
        "companyLogo"
    );


const saveCompany =
    document.getElementById(
        "saveCompany"
    );


const message =
    document.getElementById(
        "message"
    );



// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(
    text,
    type
) {

    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";

}



// ==========================================
// LOAD COMPANY
// ==========================================

async function loadCompany() {


    loading.style.display =
        "block";


    dashboardContent.style.display =
        "none";


    try {


        // ======================================
        // GET CURRENT USER
        // ======================================

        const {

            data: userData,

            error: userError

        } =
        await web3Supabase
            .auth
            .getUser();


        if (userError) {

            throw userError;

        }


        const user =
            userData.user;



        // ======================================
        // USER NOT LOGGED IN
        // ======================================

        if (!user) {


            loading.textContent =
                "يجب تسجيل الدخول أولاً.";


            setTimeout(

                function() {

                    window.location.href =
                        "login.html";

                },

                1500

            );


            return;

        }



        // ======================================
        // SHOW USER
        // ======================================

        userInfo.textContent =
            "الحساب: " +
            (
                user.email ||
                user.id
            );



        console.log(
            "Logged user:",
            user.id
        );



        // ======================================
        // GET COMPANY
        // ======================================

        const {

            data: company,

            error: companyError

        } =
        await web3Supabase

            .from("companies")

            .select(
                "id,user_id,name,description,website,location,logo_url,created_at"
            )

            .eq(
                "user_id",
                user.id
            )

            .maybeSingle();



        // ======================================
        // CHECK ERROR
        // ======================================

        if (companyError) {


            console.error(
                "Company fetch error:",
                companyError
            );


            throw companyError;

        }



        // ======================================
        // COMPANY EXISTS
        // ======================================

        if (company) {


            console.log(
                "Company found:",
                company
            );


            companyName.value =
                company.name || "";


            companyDescription.value =
                company.description || "";


            companyWebsite.value =
                company.website || "";


            companyLocation.value =
                company.location || "";


            companyLogo.value =
                company.logo_url || "";


        }


        // ======================================
        // NO COMPANY
        // ======================================

        else {


            console.log(
                "No company profile yet."
            );


            companyName.value =
                "";


            companyDescription.value =
                "";


            companyWebsite.value =
                "";


            companyLocation.value =
                "";


            companyLogo.value =
                "";

        }



        // ======================================
        // SHOW DASHBOARD
        // ======================================

        loading.style.display =
            "none";


        dashboardContent.style.display =
            "block";


    }


    catch (error) {


        console.error(
            "LOAD COMPANY ERROR:",
            error
        );


        loading.textContent =
            "فشل في جلب بيانات الشركة.";


        showMessage(

            "فشل في جلب بيانات الشركة: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),

            "error"

        );

    }

}



// ==========================================
// SAVE COMPANY
// ==========================================

saveCompany.addEventListener(

    "click",

    async function() {


        // ======================================
        // DISABLE BUTTON
        // ======================================

        saveCompany.disabled =
            true;


        saveCompany.textContent =
            "جاري الحفظ...";


        message.style.display =
            "none";



        try {


            // ======================================
            // GET CURRENT USER
            // ======================================

            const {

                data: userData,

                error: userError

            } =
            await web3Supabase
                .auth
                .getUser();


            if (userError) {

                throw userError;

            }


            const user =
                userData.user;



            if (!user) {

                throw new Error(
                    "يجب تسجيل الدخول أولاً."
                );

            }



            // ======================================
            // GET FORM DATA
            // ======================================

            const name =
                companyName.value.trim();


            const description =
                companyDescription.value.trim();


            const website =
                companyWebsite.value.trim();


            const location =
                companyLocation.value.trim();


            const logo_url =
                companyLogo.value.trim();



            // ======================================
            // VALIDATION
            // ======================================

            if (!name) {


                showMessage(

                    "من فضلك اكتب اسم الشركة.",

                    "error"

                );


                saveCompany.disabled =
                    false;


                saveCompany.textContent =
                    "حفظ بيانات الشركة";


                return;

            }



            // ======================================
            // CHECK EXISTING COMPANY
            // ======================================

            const {

                data: existingCompany,

                error: checkError

            } =
            await web3Supabase

                .from("companies")

                .select("id")

                .eq(
                    "user_id",
                    user.id
                )

                .maybeSingle();



            if (checkError) {

                throw checkError;

            }



            // ======================================
            // UPDATE EXISTING COMPANY
            // ======================================

            if (existingCompany) {


                console.log(
                    "Updating company:",
                    existingCompany.id
                );


                const {

                    error: updateError

                } =
                await web3Supabase

                    .from("companies")

                    .update({

                        name:
                            name,

                        description:
                            description,

                        website:
                            website,

                        location:
                            location,

                        logo_url:
                            logo_url

                    })

                    .eq(
                        "id",
                        existingCompany.id
                    );


                if (updateError) {

                    throw updateError;

                }


                showMessage(

                    "تم تحديث بيانات الشركة بنجاح ✅",

                    "success"

                );

            }



            // ======================================
            // CREATE NEW COMPANY
            // ======================================

            else {


                console.log(
                    "Creating new company..."
                );


                const {

                    error: insertError

                } =
                await web3Supabase

                    .from("companies")

                    .insert({

                        user_id:
                            user.id,

                        name:
                            name,

                        description:
                            description,

                        website:
                            website,

                        location:
                            location,

                        logo_url:
                            logo_url

                    });


                if (insertError) {

                    throw insertError;

                }


                showMessage(

                    "تم إنشاء ملف الشركة بنجاح ✅",

                    "success"

                );

            }


        }


        catch (error) {


            console.error(
                "SAVE COMPANY ERROR:",
                error
            );


            showMessage(

                "فشل حفظ بيانات الشركة: " +
                (
                    error.message ||
                    "خطأ غير معروف"
                ),

                "error"

            );

        }


        finally {


            saveCompany.disabled =
                false;


            saveCompany.textContent =
                "حفظ بيانات الشركة";

        }


    }

);



// ==========================================
// AUTH STATE CHANGE
// ==========================================

web3Supabase.auth.onAuthStateChange(

    function(
        event,
        session
    ) {


        console.log(
            "Auth event:",
            event
        );


        if (!session) {


            window.location.href =
                "login.html";


        }


    }

);



// ==========================================
// START
// ==========================================

document.addEventListener(

    "DOMContentLoaded",

    function() {

        loadCompany();

    }

);


</script>


</body>

</html>
