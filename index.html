<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Web3Jobs</title>

<link rel="stylesheet" href="css/style.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.register-container {
    max-width: 450px;
    margin: 80px auto;
    padding: 35px;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.10);
}

.register-container h1 {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

.register-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.register-button:hover {
    background: #1d4ed8;
}

.register-button:disabled {
    background: #999;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    display: none;
}

.success {
    display: block !important;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block !important;
    background: #fee2e2;
    color: #991b1b;
}

.login-link {
    text-align: center;
    margin-top: 20px;
}

.login-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

</style>

</head>


<body>


<!-- Header -->

<header>

<div class="logo">

<a href="index.html">
Web3Jobs
</a>

</div>


<nav>

<a href="index.html">
Home
</a>

<a href="index.html#jobs">
Jobs
</a>

<a href="companies.html">
Companies
</a>

<a href="roadmap.html">
Roadmap
</a>

<a class="nav-btn" href="login.html">
Login
</a>

</nav>

</header>



<!-- Register -->

<section class="register-container">

<h1>
Create Your Account
</h1>


<form id="registerForm">


<div class="form-group">

<label for="name">
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required
>

</div>



<div class="form-group">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

</div>



<div class="form-group">

<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required
>

</div>



<div class="form-group">

<label for="confirmPassword">
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
required
>

</div>



<button
type="submit"
class="register-button"
id="registerButton"
>

Create Account

</button>

</form>



<div id="message"></div>



<div class="login-link">

Already have an account?

<a href="login.html">
Login
</a>

</div>


</section>



<!-- Footer -->

<footer>

<p>
© 2026 Web3Jobs - Web3 Career Platform
</p>

</footer>



<script>


// ==========================================
// SUPABASE CONFIGURATION
// ==========================================

const SUPABASE_URL =
"https://uewocyaspztybnvnkbmo.supabase.co";


const SUPABASE_KEY =
"sb_publishable_ap9UMOBhdHdIkW0FCD25nA_NurNviS0";


// Create Supabase client

const { createClient } = supabase;

const supabaseClient =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



// ==========================================
// REGISTER
// ==========================================

const registerForm =
document.getElementById("registerForm");

const registerButton =
document.getElementById("registerButton");

const message =
document.getElementById("message");



registerForm.addEventListener(
"submit",
async function(event) {

    event.preventDefault();


    const name =
    document.getElementById("name")
    .value
    .trim();


    const email =
    document.getElementById("email")
    .value
    .trim();


    const password =
    document.getElementById("password")
    .value;


    const confirmPassword =
    document.getElementById("confirmPassword")
    .value;



    // Clear previous message

    message.className = "";

    message.style.display = "none";



    // Check passwords

    if (password !== confirmPassword) {

        message.textContent =
        "Passwords do not match.";

        message.className =
        "error";

        return;

    }



    // Check password length

    if (password.length < 6) {

        message.textContent =
        "Password must be at least 6 characters.";

        message.className =
        "error";

        return;

    }



    // Disable button

    registerButton.disabled = true;

    registerButton.textContent =
    "Creating account...";



    try {


        // ======================================
        // SUPABASE SIGN UP
        // ======================================

        const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    full_name: name

                },

                emailRedirectTo:
                window.location.origin +
                "/login.html"

            }

        });



        // ======================================
        // ERROR
        // ======================================

        if (error) {

            console.error(error);

            message.textContent =
            error.message;

            message.className =
            "error";

            registerButton.disabled =
            false;

            registerButton.textContent =
            "Create Account";

            return;

        }



        // ======================================
        // SUCCESS
        // ======================================

        message.textContent =
        "Account created successfully. Please check your email to confirm your account.";

        message.className =
        "success";


        registerForm.reset();


        registerButton.textContent =
        "Account Created";


    }

    catch(error) {

        console.error(error);

        message.textContent =
        "Something went wrong. Please try again.";

        message.className =
        "error";


        registerButton.disabled =
        false;

        registerButton.textContent =
        "Create Account";

    }

});

</script>


</body>

</html>
