<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Web3Jobs</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- =========================
     Header
========================= -->

<header>

    <div class="logo">
        Web3Jobs
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="jobs.html">
            Jobs
        </a>

        <a href="companies.html">
            Companies
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<!-- =========================
     Hero
========================= -->

<section class="hero">

    <h1>
        Create Your Web3Jobs Account
    </h1>

    <p>
        Choose your account type and join Web3Jobs.
    </p>

</section>



<!-- =========================
     Register
========================= -->

<section class="features">

    <div class="card">

        <h2>
            Create Account
        </h2>


        <form id="registerForm">


            <!-- =========================
                 Account Type
            ========================= -->

            <h3>
                Choose account type
            </h3>


            <div style="margin:20px 0;">


                <label style="display:block; margin:12px 0;">

                    <input
                        type="radio"
                        name="accountType"
                        value="individual"
                        required
                    >

                    👤 Individual

                </label>



                <label style="display:block; margin:12px 0;">

                    <input
                        type="radio"
                        name="accountType"
                        value="company"
                        required
                    >

                    🏢 Company

                </label>


            </div>



            <!-- =========================
                 Email
            ========================= -->

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:10px 0;
                    border-radius:8px;
                    border:none;
                    box-sizing:border-box;
                "
            >



            <!-- =========================
                 Password
            ========================= -->

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="new-password"
                minlength="6"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:10px 0;
                    border-radius:8px;
                    border:none;
                    box-sizing:border-box;
                "
            >



            <!-- =========================
                 Confirm Password
            ========================= -->

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                autocomplete="new-password"
                minlength="6"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:10px 0;
                    border-radius:8px;
                    border:none;
                    box-sizing:border-box;
                "
            >



            <!-- =========================
                 Submit
            ========================= -->

            <button
                type="submit"
                class="btn"
                id="registerButton"
            >

                Create Account

            </button>


        </form>



        <!-- =========================
             Message
        ========================= -->

        <p
            id="message"
            style="margin-top:20px;"
        ></p>



        <!-- =========================
             Login
        ========================= -->

        <p>

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>

</section>



<!-- =========================
     Footer
========================= -->

<footer>

    <p>
        © 2026 Web3Jobs. All Rights Reserved.
    </p>

</footer>



<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// =====================================================
// SUPABASE CONFIGURATION
// =====================================================

const SUPABASE_URL =
    "https://uewocyaspztybnvnkbmo.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_ap9UMOBhdHdIkW0FCD25nA_NurNviS0";



// =====================================================
// CREATE SUPABASE CLIENT
// =====================================================

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// =====================================================
// ELEMENTS
// =====================================================

const registerForm =
    document.getElementById("registerForm");


const message =
    document.getElementById("message");


const registerButton =
    document.getElementById("registerButton");



// =====================================================
// REGISTER
// =====================================================

registerForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        // =============================================
        // GET VALUES
        // =============================================

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const accountTypeElement =
            document.querySelector(
                'input[name="accountType"]:checked'
            );



        // =============================================
        // CHECK ACCOUNT TYPE
        // =============================================

        if (!accountTypeElement) {

            message.textContent =
                "Please choose Individual or Company.";

            return;

        }


        const accountType =
            accountTypeElement.value;



        // =============================================
        // CHECK PASSWORD
        // =============================================

        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;

        }


        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            return;

        }



        // =============================================
        // CHECK ACCOUNT TYPE VALUE
        // =============================================

        if (
            accountType !== "individual" &&
            accountType !== "company"
        ) {

            message.textContent =
                "Invalid account type.";

            return;

        }



        // =============================================
        // LOADING
        // =============================================

        registerButton.disabled = true;

        registerButton.textContent =
            "Creating Account...";

        message.textContent =
            "Creating your account...";



        try {


            // =========================================
            // CREATE SUPABASE ACCOUNT
            // =========================================

            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        account_type:
                            accountType

                    }

                }

            });



            // =========================================
            // SUPABASE ERROR
            // =========================================

            if (error) {

                console.error(
                    "Supabase registration error:",
                    error
                );


                message.textContent =
                    error.message;


                registerButton.disabled =
                    false;


                registerButton.textContent =
                    "Create Account";


                return;

            }



            // =========================================
            // USER CREATED
            // =========================================

            if (data && data.user) {


                console.log(
                    "User created:",
                    data.user
                );


                console.log(
                    "Account type:",
                    accountType
                );


                // =====================================
                // SUCCESS
                // =====================================

                message.textContent =
                    "Account created successfully! " +
                    "Please check your email to confirm your account.";


                registerForm.reset();


                registerButton.disabled =
                    false;


                registerButton.textContent =
                    "Create Account";


                return;

            }



            // =========================================
            // UNKNOWN RESULT
            // =========================================

            message.textContent =
                "Account creation failed.";



            registerButton.disabled =
                false;


            registerButton.textContent =
                "Create Account";


        }


        catch (error) {


            console.error(
                "Registration connection error:",
                error
            );


            message.textContent =
                "Registration failed: " +
                error.message;


            registerButton.disabled =
                false;


            registerButton.textContent =
                "Create Account";

        }

    }

);

</script>


</body>

    </html>
