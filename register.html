<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Web3Jobs</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">
        Web3Jobs
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="companies.html">Companies</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<section class="hero">

    <h1>Create Your Web3Jobs Account</h1>

    <p>Choose your account type and join Web3Jobs.</p>

</section>


<section class="features">

    <div class="card">

        <h2>Create Account</h2>

        <form id="registerForm">

            <h3>Choose account type</h3>

            <label>
                <input
                    type="radio"
                    name="accountType"
                    value="individual"
                    required
                >
                👤 Individual
            </label>

            <label>
                <input
                    type="radio"
                    name="accountType"
                    value="company"
                    required
                >
                🏢 Company
            </label>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="6"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                minlength="6"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</section>


<footer>

    <p>© 2026 Web3Jobs. All Rights Reserved.</p>

</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://uewocyaspztybnvynkbmo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ap9UMOBhdHdIkW0FCD25nA_NurNviS0";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const registerForm =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const accountType =
            document.querySelector(
                'input[name="accountType"]:checked'
            );


        if (!accountType) {

            message.textContent =
                "Please choose Individual or Company.";

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            return;
        }


        message.textContent =
            "Creating account...";


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        account_type:
                            accountType.value
                    }

                }

            });


        if (error) {

            message.textContent =
                error.message;

            console.error(error);

            return;
        }


        if (data.user) {

            message.textContent =
                "Account created successfully! Please check your email to confirm your account.";

            registerForm.reset();

        }

    }
);

</script>

</body>

</html>
