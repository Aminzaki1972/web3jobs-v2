<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Web3Jobs</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- =========================
     Header
========================= -->

<header>

    <div class="logo">
        Web3Jobs
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="jobs.html">
            Jobs
        </a>

        <a href="companies.html">
            Companies
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<!-- =========================
     Hero
========================= -->

<section class="hero">

    <h1>
        Create Your Web3Jobs Account
    </h1>

    <p>
        Choose your account type and join Web3Jobs.
    </p>

</section>



<!-- =========================
     Register Section
========================= -->

<section class="features">

    <div class="card">

        <h2>
            Create Account
        </h2>


        <form id="registerForm">


            <!-- Account Type -->

            <h3>
                Choose account type
            </h3>


            <div style="margin:20px 0;">


                <label style="display:block; margin:12px 0;">

                    <input
                        type="radio"
                        name="accountType"
                        value="individual"
                        required
                    >

                    👤 Individual

                </label>



                <label style="display:block; margin:12px 0;">

                    <input
                        type="radio"
                        name="accountType"
                        value="company"
                        required
                    >

                    🏢 Company

                </label>


            </div>



            <!-- Email -->

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:10px 0;
                    border-radius:8px;
                    border:none;
                    box-sizing:border-box;
                "
            >



            <!-- Password -->

            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="6"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:10px 0;
                    border-radius:8px;
                    border:none;
                    box-sizing:border-box;
                "
            >



            <!-- Confirm Password -->

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                minlength="6"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:10px 0;
                    border-radius:8px;
                    border:none;
                    box-sizing:border-box;
                "
            >



            <!-- Submit -->

            <button
                type="submit"
                class="btn"
            >

                Create Account

            </button>


        </form>



        <!-- Message -->

        <p
            id="message"
            style="margin-top:20px;"
        ></p>



        <!-- Login -->

        <p>

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>

</section>



<!-- =========================
     Footer
========================= -->

<footer>

    <p>
        © 2026 Web3Jobs. All Rights Reserved.
    </p>

</footer>



<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


// ========================================
// Supabase Configuration
// ========================================

const SUPABASE_URL =
    "https://uewocyaspztybnvynkbmo.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_ap9UMOBhdHdIkW0FCD25nA_NurNviS0";


// ========================================
// Create Supabase Client
// ========================================

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// ========================================
// Register Form
// ========================================

const registerForm =
    document.getElementById("registerForm");


const message =
    document.getElementById("message");



// ========================================
// Register
// ========================================

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // Get values

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const accountType =
            document.querySelector(
                'input[name="accountType"]:checked'
            );



        // ========================================
        // Validate account type
        // ========================================

        if (!accountType) {

            message.textContent =
                "Please choose Individual or Company.";

            return;

        }



        // ========================================
        // Validate password
        // ========================================

        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            return;

        }



        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;

        }



        // ========================================
        // Loading
        // ========================================

        message.textContent =
            "Creating account...";



        // ========================================
        // Create Supabase Account
        // ========================================

        try {


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            account_type:
                                accountType.value

                        }

                    }

                });



            // ========================================
            // Supabase Error
            // ========================================

            if (error) {

                console.error(
                    "Supabase signup error:",
                    error
                );


                message.textContent =
                    error.message;


                return;

            }



            // ========================================
            // Success
            // ========================================

            if (data && data.user) {

                message.textContent =
                    "Account created successfully! Please check your email to confirm your account.";


                registerForm.reset();


            } else {

                message.textContent =
                    "Account creation failed.";

            }


        }

        catch (error) {


            console.error(
                "Connection error:",
                error
            );


            message.textContent =
                "Failed to connect to Supabase. Please try again.";


        }

    }

);

</script>


</body>

</html>
